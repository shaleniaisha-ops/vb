<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Level 02 — Circuit Match</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center;font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(135deg,#eef7ff,#f7f1ff);color:#183153}.game{width:min(900px,100%);background:#fff;border-radius:28px;padding:32px;box-shadow:0 18px 50px rgba(24,49,83,.14)}.head{display:flex;justify-content:space-between;gap:20px;align-items:center}.level{background:#183153;color:#fff;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:800}h1{margin:10px 0 4px;font-size:clamp(28px,5vw,44px)}.sub{margin:0 0 22px;color:#60728b}.score{background:#eef5ff;padding:12px 17px;border-radius:16px;font-weight:800;white-space:nowrap}.inst{background:#f7f9fc;border-left:5px solid #4d8cff;padding:14px 16px;border-radius:12px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.ct{font-size:14px;font-weight:800;color:#60728b;text-transform:uppercase;margin-bottom:10px}.item{width:100%;border:2px solid #dbe5f2;background:#fff;border-radius:16px;padding:17px;margin-bottom:12px;cursor:pointer;text-align:left;font-size:16px;font-weight:800;color:#183153}.item.selected{border-color:#4d8cff;background:#edf4ff}.item.matched{cursor:default;opacity:.65;border-color:#43a047;background:#edf9ef}.item.wrong{border-color:#e45757;background:#fff0f0}.feed{min-height:28px;margin:16px 0;text-align:center;font-weight:800}.ok{color:#2e7d32}.bad{color:#c62828}.prog{height:10px;background:#e8eef6;border-radius:99px;overflow:hidden;margin:20px 0}.bar{height:100%;width:0;background:#4d8cff;transition:.3s}.result{display:none;text-align:center;padding:24px;background:#f4f9ff;border-radius:20px}.btn{border:0;border-radius:14px;padding:13px 20px;background:#183153;color:#fff;font-weight:800;cursor:pointer}@media(max-width:650px){.game{padding:22px}.head{flex-direction:column;align-items:flex-start}.cols{grid-template-columns:1fr}}</style></head><body><main class="game"><div class="head"><div><span class="level">LEVEL 02</span><h1>⚡ Circuit Match</h1><p class="sub">Match the concept with the correct meaning!</p></div><div class="score">⭐ Score: <span id="score">0</span>/5</div></div><div class="inst"><strong>How to play:</strong> Click one concept, then click its matching meaning.</div><div class="prog"><div class="bar" id="bar"></div></div><section class="cols"><div><div class="ct">🔌 Concepts</div><button class="item concept" data-key="series">SERIES</button><button class="item concept" data-key="parallel">PARALLEL</button><button class="item concept" data-key="closed">CLOSED SWITCH</button><button class="item concept" data-key="open">OPEN SWITCH</button><button class="item concept" data-key="cell">DRY CELL</button></div><div><div class="ct">💡 Meanings</div><button class="item meaning" data-key="open">Broken path</button><button class="item meaning" data-key="cell">Source of electrical energy</button><button class="item meaning" data-key="series">One path</button><button class="item meaning" data-key="closed">Complete path</button><button class="item meaning" data-key="parallel">More than one path</button></div></section><div class="feed" id="feed"></div><div class="result" id="result"><h2>🎉 Perfect Match!</h2><p>You matched all 5 circuit concepts correctly.</p><button class="btn" onclick="location.reload()">🔄 Play Again</button></div></main><script>
let selected=null,score=0,matched=0;const cs=document.querySelectorAll(".concept"),ms=document.querySelectorAll(".meaning"),feed=document.getElementById("feed"),bar=document.getElementById("bar"),scoreEl=document.getElementById("score");
cs.forEach(b=>b.onclick=()=>{if(b.classList.contains("matched"))return;cs.forEach(x=>x.classList.remove("selected"));b.classList.add("selected");selected=b;feed.textContent="Now choose the matching meaning 👇";feed.className="feed"});
ms.forEach(b=>b.onclick=()=>{if(!selected||b.classList.contains("matched"))return;if(selected.dataset.key===b.dataset.key){selected.classList.remove("selected");selected.classList.add("matched");b.classList.add("matched");score++;matched++;scoreEl.textContent=score;bar.style.width=matched/5*100+"%";feed.textContent="✅ Correct! Great job!";feed.className="feed ok";selected=null;if(matched===5)document.getElementById("result").style.display="block"}else{b.classList.add("wrong");feed.textContent="❌ Not quite. Try another meaning!";feed.className="feed bad";setTimeout(()=>b.classList.remove("wrong"),350)}});
</script></body></html>
